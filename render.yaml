services:
  - type: web
    name: ai-detection-api
    runtime: python
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MODEL_NAME
        value: roberta-base-openai-detector
      - key: PYTHON_VERSION
        value: "3.11.0"
