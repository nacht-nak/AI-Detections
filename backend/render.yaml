services:
  - type: web
    name: ai-detection-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MODEL_NAME
        value: roberta-base-openai-detector
      - key: PORT
        value: "8000"
